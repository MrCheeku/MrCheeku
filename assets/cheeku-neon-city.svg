<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Mr. Cheeku — Neon City 3050</title>
<desc id="desc">An original futuristic skyline with neon pink and electric blue light, a rising digital sun, and the Mr. Cheeku identity.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#090b18"/>
    <stop offset="48%" stop-color="#1a1530"/>
    <stop offset="100%" stop-color="#0b2030"/>
  </linearGradient>
  <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ffd4ed"/>
    <stop offset="45%" stop-color="#ef93c4"/>
    <stop offset="100%" stop-color="#8e6bff"/>
  </linearGradient>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ef93c4"/>
    <stop offset="52%" stop-color="#a58cff"/>
    <stop offset="100%" stop-color="#63d9ff"/>
  </linearGradient>
  <linearGradient id="city" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#20203d"/>
    <stop offset="100%" stop-color="#090d19"/>
  </linearGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="7" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#9fb5ff" stroke-opacity=".075" stroke-width="1"/>
  </pattern>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <path d="M0 0H4" stroke="#dce7ff" stroke-opacity=".035"/>
  </pattern>
</defs>

<rect width="1200" height="430" rx="24" fill="url(#sky)"/>
<rect width="1200" height="430" rx="24" fill="url(#grid)"/>

<g fill="#d8e8ff" opacity=".7">
  <circle cx="78" cy="72" r="1.5"/><circle cx="150" cy="116" r="1"/><circle cx="252" cy="62" r="1.5"/>
  <circle cx="366" cy="94" r="1"/><circle cx="468" cy="48" r="1.3"/><circle cx="565" cy="100" r="1"/>
  <circle cx="684" cy="58" r="1.4"/><circle cx="770" cy="98" r="1"/><circle cx="1056" cy="63" r="1.5"/>
  <circle cx="1130" cy="124" r="1"/>
</g>

<circle cx="922" cy="185" r="104" fill="#ef93c4" opacity=".12" filter="url(#glow)"/>
<circle cx="922" cy="185" r="84" fill="url(#sun)" opacity=".92"/>
<g stroke="#3c244e" stroke-width="8" opacity=".55">
  <path d="M842 178H1002"/><path d="M850 199H994"/><path d="M865 220H979"/>
</g>
<path d="M780 288 Q920 240 1060 288" fill="none" stroke="#ef93c4" stroke-width="2" opacity=".45" filter="url(#glow)"/>

<path d="M0 " fill="url(#city)" opacity=".98"/>

<g fill="#ef93c4" opacity=".78">
  <rect x="56" y="216" width="4" height="8" rx="1"/><rect x="126" y="194" width="4" height="7" rx="1"/>
  <rect x="242" y="181" width="5" height="8" rx="1"/><rect x="359" y="211" width="4" height="7" rx="1"/>
  <rect x="472" y="223" width="4" height="7" rx="1"/><rect x="627" y="201" width="4" height="7" rx="1"/>
  <rect x="750" y="219" width="4" height="8" rx="1"/><rect x="886" y="229" width="4" height="7" rx="1"/>
  <rect x="1020" y="216" width="4" height="8" rx="1"/><rect x="1148" y="231" width="4" height="7" rx="1"/>
</g>
<g fill="#63d9ff" opacity=".65">
  <rect x="88" y="260" width="4" height="7" rx="1"/><rect x="276" y="260" width="4" height="7" rx="1"/>
  <rect x="402" y="246" width="4" height="7" rx="1"/><rect x="552" y="251" width="4" height="7" rx="1"/>
  <rect x="690" y="256" width="4" height="7" rx="1"/><rect x="824" y="250" width="4" height="7" rx="1"/>
  <rect x="1080" y="247" width="4" height="7" rx="1"/>
</g>

<path d="M0 324H1200" stroke="url(#neon)" stroke-width="2" opacity=".8" filter="url(#glow)"/>
<path d="M0 350 Q330 310 600 350 T1200 342" fill="none" stroke="#63d9ff" stroke-width="1.5" opacity=".45"/>
<path d="M0 377 Q340 335 650 374 T1200 365" fill="none" stroke="#ef93c4" stroke-width="1.5" opacity=".35"/>

<g>
  <text x="70" y="160" fill="#fff4fc" font-family="Segoe UI,Arial,sans-serif" font-size="66" font-weight="800" letter-spacing="4">MR. CHEEKU</text>
  <path d="M72 179H540" stroke="url(#neon)" stroke-width="4" filter="url(#glow)"/>
  <text x="74" y="218" fill="#f2c5e2" font-family="Consolas,monospace" font-size="18" letter-spacing="3">CLASSIC ANIME SOUL</text>
  <text x="74" y="248" fill="#9fdfff" font-family="Consolas,monospace" font-size="15" letter-spacing="2">SOFTWARE · AI · CREATIVE TECHNOLOGY</text>
</g>

<g fill="#9edfff" font-family="Consolas,monospace" font-size="10" opacity=".8">
  <text x="72" y="44">NEURAL DISTRICT / 3050.10</text>
  <text x="1128" y="44" text-anchor="end">SYSTEM STATUS: ONLINE</text>
  <text x="72" y="405">BUILD // LEARN // EXPERIMENT // REPEAT</text>
  <text x="1128" y="405" text-anchor="end">ENGINEERED BY MR.CHEEKU</text>
</g>

<g fill="none" stroke="#ef93c4" stroke-width="1.5" opacity=".65">
  <path d="M1068 105h42v42"/><path d="M1130 105h-20v20"/>
  <path d="M66 286h30v-30"/><path d="M110 286H96"/>
</g>
<path d="M0 0H1200V430H0Z" fill="url(#scan)" opacity=".65"/>
<rect x="1" y="1" width="1198" height="428" rx="24" fill="none" stroke="url(#neon)" stroke-opacity=".55" stroke-width="2"/>

<circle cx="1110" cy="315" r="3" fill="#63d9ff" filter="url(#glow)">
  <animate attributeName="opacity" values=".35;1;.35" dur="3.2s" repeatCount="indefinite"/>
</circle>
<path d="M72 270H360" stroke="#ef93c4" stroke-width="1" opacity=".25">
  <animate attributeName="opacity" values=".15;.55;.15" dur="4s" repeatCount="indefinite"/>
</path>
</svg>