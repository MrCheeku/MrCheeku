<text x="38" y="91" text-anchor="start" fill="#d8deef" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600">Kotlin  ·  84.9%</text><rect x="270" y="78" width="500" height="13" rx="6.5" fill="#242a40"/><rect x="270" y="78" width="424.7" height="13" rx="6.5" fill="url(#neon)"/><text x="38" y="120" text-anchor="start" fill="#d8deef" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600">TypeScript  ·  9.7%</text><rect x="270" y="107" width="500" height="13" rx="6.5" fill="#242a40"/><rect x="270" y="107" width="48.4" height="13" rx="6.5" fill="url(#neon)"/><text x="38" y="149" text-anchor="start" fill="#d8deef" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600">Python  ·  4.9%</text><rect x="270" y="136" width="500" height="13" rx="6.5" fill="#242a40"/><rect x="270" y="136" width="24.4" height="13" rx="6.5" fill="url(#neon)"/><text x="38" y="178" text-anchor="start" fill="#d8deef" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600">HTML  ·  0.5%</text><rect x="270" y="165" width="500" height="13" rx="6.5" fill="#242a40"/><rect x="270" y="165" width="3.0" height="13" rx="6.5" fill="url(#neon)"/><text x="460" y="270" text-anchor="middle" fill="#8795b6" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400">Based on language bytes in up to 100 recently updated non-fork repositories</text></svg>