name: Profile Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install coverage
        run: python -m pip install "coverage>=7.6"
      - name: Run tests with branch coverage
        run: |
          coverage run --branch --source=scripts.profile_metrics -m unittest discover -s tests -v
          coverage report --fail-under=95
